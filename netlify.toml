[build]
publish = "."
functions = "netlify/functions"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions.ai-search]
  timeout = 26

  [functions.ai-tts]
  timeout = 20

  [functions.ai-daily-alerts]
  schedule = "0 15 * * *"
  timeout = 26

  [functions.warm-buscar-externos]
  schedule = "*/5 * * * *"

  [functions."*"]
  included_files = [
    "netlify/functions/**"
  ]
  node_bundler = "esbuild"

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

